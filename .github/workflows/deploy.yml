name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    # ── 애드센스 재심사 대비 발행량 감속 (2026-07-22) ──
    # 거절 사유가 "가치가 별로 없는 콘텐츠"였으므로, 심사 기간에는
    # 하루 4건(아침1 + 점심1 + 저녁2) → 하루 1건으로 줄인다.
    # 현재 전략인 '분당 재건축'에 집중 (서치콘솔에서 '분당재건축' 8위 확인).
    # 승인 후 아래 주석을 해제해 복원할 것.
    - cron: '0 9 * * *'  # 한국시간 저녁 6시: 재건축 해설 글 ← 유일하게 활성
    # - cron: '0 22 * * *' # 한국시간 아침 7시: 공공데이터 글 (심사 중 중단)
    # - cron: '0 3 * * *'  # 한국시간 낮 12시: 뉴스 브리핑 (심사 중 중단)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run fetch-public-data script
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *'
        run: node scripts/fetch-public-data.js
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run generate-blog-post script
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *'
        run: node scripts/generate-blog-post.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Run Fetch Seongnam News script
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
        run: node scripts/fetch-seongnam-news.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Run Generate Redevelopment Post script
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * *'
        run: node scripts/generate-redev-post.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # 심사 기간 중단 (2026-07-22) — 저녁 슬롯에 스크립트가 2개 걸려 있어
      # 하루 1건 목표를 맞추려면 재건축 해설 글만 남겨야 함.
      # 승인 후 조건을 '0 9 * * *' 로 되돌릴 것.
      - name: Run Fetch Naver Trends script
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-naver-trends.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Commit and push changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "자동 업데이트: 공공데이터 수집 및 블로그 글 생성"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_CUSDIS_APP_ID: ${{ secrets.NEXT_PUBLIC_CUSDIS_APP_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=my-local-info
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
